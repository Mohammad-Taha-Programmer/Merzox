# --enable-native-access is the same grant the launcher script carries, for
# the daemon this time. It matters wherever the daemon runs a JDK of 24 or
# newer - which is what happens on a machine that does not have the
# `org.gradle.java.home` below, and Flutter then hands Gradle Android
# Studio's bundled JDK.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.12.101-hotspot
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
