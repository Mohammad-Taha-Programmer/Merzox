name: merzox
description: "Merzox bilingual marketplace for nearby products and services."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5
  dio: ^5.10.0
  go_router: ^18.0.1
  get_it: ^9.2.1
  # Held at 10 deliberately, and not to be bumped casually. Version 11 removes
  # the ciphers and the `encryptedSharedPreferences` backend that 10 wrote
  # with, and its changelog says data saved by them is unusable afterwards -
  # every signed-in reader would lose their token silently on the update. The
  # bearer token lives here. Moving to 11 is a migration to plan, not a
  # version to bump: run 10's own migration path first, then upgrade.
  flutter_secure_storage: ^10.3.1
  easy_localization: ^3.0.8
  flutter_native_splash: ^2.4.6
  # Held at 12. Version 13 requires `compileSdk 37`, which this Flutter
  # release does not default to and which is not a released Android platform
  # on this machine - only a preview codename. What 13 adds is the Android 17
  # `ACCESS_LOCAL_NETWORK` permission, which this app does not ask for.
  # Revisit when 37 is a released platform and Flutter's default reaches it.
  permission_handler: ^12.0.3
  # Picks the profile picture off the camera or the gallery.
  image_picker: ^1.1.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: 14.0.1
  url_launcher: ^6.3.2
  share_plus: ^13.2.0
  socket_io_client: 3.1.6
  # Held together, and they move together: messaging 16.6 requires core 4.14.
  # On 4.14 every Android build prints "Your app uses the following plugins
  # that apply Kotlin Gradle Plugin (KGP): firebase_core / Future versions of
  # Flutter will fail to build". Measured, both ways round: the warning is
  # absent on 4.13 and present on 4.14. What the pair buys in return is a new
  # `AuthorizationStatus.deniedPermanently` this app treats as a denial like
  # any other. Revisit when Firebase ships a built-in-Kotlin version.
  firebase_core: 4.13.0
  firebase_messaging: 16.5.0
  # Direct, not transitive: `initializeDateFormatting` lives in
  # `package:intl/date_symbol_data_local.dart`, which easy_localization does
  # not re-export. Without it `DateFormat` has symbols for no locale and every
  # weekday name silently renders in English.
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

flutter_native_splash:
  background_image: assets/images/logo_background.png
  image: assets/images/MERZOX_LOGO.png
  android_12:
    background_image: assets/images/logo_background.png
    image: assets/images/MERZOX_LOGO.png
  android: true
  ios: true
  web: true
  fullscreen: true
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  assets:
    - assets/images/
    - assets/images/Onboarding/
    - assets/translations/
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Minion
      fonts:
        - asset: assets/fonts/MINIONVARIABLECONCEPT-ROMAN.OTF
    - family: Concept
      fonts:
        - asset: assets/fonts/Concept Medium.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
    # The designer's own glyphs, one font per icon as they were exported.
    #
    # assets/fonts/icons_fonts is the library as it was delivered; each screen
    # then has a folder holding the ones it draws, named for the section each
    # one serves rather than for the picture it happens to be. That is why
    # CampaignsProductsNotifications exists beside the library's own
    # Notifications: the two are the same drawing today, and the day the
    # offers row wants its own, one screen changes and no other does.
    - family: EditProfileIcon
      fonts:
        - asset: assets/fonts/icons_fonts/customer_profile/EditProfileIcon.ttf
    - family: MyOrdersIcon
      fonts:
        - asset: assets/fonts/icons_fonts/customer_profile/MyOrdersIcon.ttf
    - family: MapIcon
      fonts:
        - asset: assets/fonts/icons_fonts/customer_profile/MapIcon.ttf
    - family: Favorites
      fonts:
        - asset: assets/fonts/icons_fonts/customer_profile/Favorites.ttf
    - family: WhoWeAreIcon
      fonts:
        - asset: assets/fonts/icons_fonts/customer_profile/WhoWeAreIcon.ttf
    - family: ShareAppIcon
      fonts:
        - asset: assets/fonts/icons_fonts/customer_profile/ShareAppIcon.ttf
    - family: SignOutIcon
      fonts:
        - asset: assets/fonts/icons_fonts/customer_profile/SignOutIcon.ttf
    - family: BusinessesIcon
      fonts:
        - asset: assets/fonts/icons_fonts/customer_profile/BusinessesIcon.ttf
    - family: ProfileIcon
      fonts:
        - asset: assets/fonts/icons_fonts/customer_profile/ProfileIcon.ttf
    - family: FacebookLogoIcon
      fonts:
        - asset: assets/fonts/icons_fonts/customer_profile/FacebookLogoIcon.ttf
    - family: InstagramLogoIcon
      fonts:
        - asset: assets/fonts/icons_fonts/customer_profile/InstagramLogoIcon.ttf
    - family: CampaignsProductsNotifications
      fonts:
        - asset: >-
            assets/fonts/icons_fonts/customer_profile/CampaignsProductsNotifications.ttf
    # The two bottom bars. Home and the profile mark are the same drawing on
    # both, and are copied into both folders rather than shared: the customer's
    # bar and the merchant's are two surfaces, and the day one of them wants a
    # different home, one folder changes and the other does not.
    - family: CustomerNavHome
      fonts:
        - asset: assets/fonts/icons_fonts/customer_navigation_bar/CustomerNavHome.ttf
    - family: CustomerNavCart
      fonts:
        - asset: assets/fonts/icons_fonts/customer_navigation_bar/CustomerNavCart.ttf
    - family: CustomerNavStores
      fonts:
        - asset: assets/fonts/icons_fonts/customer_navigation_bar/CustomerNavStores.ttf
    - family: CustomerNavMessages
      fonts:
        - asset: >-
            assets/fonts/icons_fonts/customer_navigation_bar/CustomerNavMessages.ttf
    - family: CustomerNavProfile
      fonts:
        - asset: >-
            assets/fonts/icons_fonts/customer_navigation_bar/CustomerNavProfile.ttf
    - family: MerchantNavHome
      fonts:
        - asset: assets/fonts/icons_fonts/merchant_navigation_bar/MerchantNavHome.ttf
    - family: MerchantNavOrders
      fonts:
        - asset: >-
            assets/fonts/icons_fonts/merchant_navigation_bar/MerchantNavOrders.ttf
    - family: MerchantNavAddProduct
      fonts:
        - asset: >-
            assets/fonts/icons_fonts/merchant_navigation_bar/MerchantNavAddProduct.ttf
    - family: MerchantNavProducts
      fonts:
        - asset: >-
            assets/fonts/icons_fonts/merchant_navigation_bar/MerchantNavProducts.ttf
    - family: MerchantNavProfile
      fonts:
        - asset: >-
            assets/fonts/icons_fonts/merchant_navigation_bar/MerchantNavProfile.ttf
